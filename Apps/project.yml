# Lisa's Apple applications (APPLE-01), generated with XcodeGen 2.46.0 on a Mac:
#   cd Apps && xcodegen generate --spec project.yml
# The targets live outside Package.swift and link Lisa's Swift packages from the repository root. Signing values are
# placeholders; put your own Team ID in Config/Signing.local.xcconfig, which git ignores (docs/SETUP-APPLE.md).
name: Lisa
options:
  bundleIdPrefix: org.example.lisa
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Lisa:
    path: ..
targets:
  LisaCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Companion
      - path: Shared
    dependencies:
      - package: Lisa
        product: LisaAPIContract
      - package: Lisa
        product: LisaClient
      - package: Lisa
        product: LisaPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.lisa.companion
        PRODUCT_NAME: Lisa
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/Companion-Info.plist
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Companion-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Companion-Release.entitlements
  LisaMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Mac
      - path: Shared
    dependencies:
      - package: Lisa
        product: LisaAPIContract
      - package: Lisa
        product: LisaClient
      - package: Lisa
        product: LisaPresentation
      - package: Lisa
        product: LisaHost
      - package: Lisa
        product: LisaPorts
      - package: Lisa
        product: LisaSecrets
      - package: Lisa
        product: LisaRedaction
      # Imported directly by the embedded-host controller (configuration, lock and runtime) and the local-notification
      # content; all are already in LisaHost's dependency closure. The local-notification installation goes through
      # LisaHost's own API, so the app imports neither LisaApplication nor LisaDevices.
      - package: Lisa
        product: LisaConfig
      - package: Lisa
        product: LisaRuntime
      - package: Lisa
        product: LisaDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.lisa.mac
        PRODUCT_NAME: Lisa
        INFOPLIST_FILE: Config/Mac-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Mac-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Mac-Release.entitlements
  # PROOF ONLY (plan R2 §8.7, §10.6 X1; docs/DECISIONS.md D-54): the X1 proof app — nearby proofs of both designs, the
  # fetch probe with Core unavailable, and the proof-only certificate encoder. It never ships and no product links it.
  # One target for the Mac, the iPhone and the iPad, so its scheme LisaProof offers all three destinations; building it
  # for each SDK builds the portable modules and swift-crypto (E-2). Pass the built commit with
  # `xcodebuild … LISA_PROOF_COMMIT=$(git rev-parse HEAD)`.
  LisaProof:
    type: application
    supportedDestinations: [iOS, macOS]
    platform: auto
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: Proof
    dependencies:
      - package: Lisa
        product: LisaTrust
      - package: Lisa
        product: LisaSyncProtocol
      - package: Lisa
        product: LisaCrypto
      # R1's URL policy, IP literals and address classification for the fetch probe (§8.9.3).
      - package: Lisa
        product: LisaHTTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.lisa.proof
        PRODUCT_NAME: LisaProof
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        LISA_PROOF_COMMIT: ""
        "INFOPLIST_FILE[sdk=iphoneos*]": Config/Proof-iOS-Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Config/Proof-iOS-Info.plist
        "INFOPLIST_FILE[sdk=macosx*]": Config/Proof-macOS-Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Proof-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Proof-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Proof-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
